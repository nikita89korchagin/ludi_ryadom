<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Люди рядом</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
            color: var(--tg-theme-link-color, #2481cc);
        }
        .btn {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 500;
            width: 100%;
            max-width: 280px;
        }
        .user-list {
            width: 100%;
            max-width: 400px;
            margin-top: 20px;
        }
        .user-card {
            background: var(--tg-theme-secondary-bg-color, #f4f4f5);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .distance {
            font-weight: bold;
            color: var(--tg-theme-link-color, #2481cc);
        }
        #status {
            margin-top: 15px;
            font-size: 14px;
            color: #888;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="header">Кто рядом со мной?</div>
    <button class="btn" id="find-btn">Найти людей поблизости</button>
    <div id="status">Нажмите кнопку, чтобы поделиться геопозицией</div>

    <div class="user-list" id="users">
        </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand(); // Расширяем приложение на весь экран

        document.getElementById('find-btn').addEventListener('click', () => {
            const status = document.getElementById('status');
            status.innerText = "Определяем вашу геопозицию...";

            if (!navigator.geolocation) {
                status.innerText = "Геолокация не поддерживается вашим устройством.";
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    
                    status.innerText = `Ваши координаты получены. Ищем людей...`;
                    
                    // Показываем список людей вокруг (пока это демонстрационные данные)
                    showMockUsers();
                },
                () => {
                    status.innerText = "Не удалось получить доступ к геопозиции. Разрешите доступ в настройках.";
                }
            );
        });

        function showMockUsers() {
            const usersContainer = document.getElementById('users');
            usersContainer.innerHTML = ''; // Очистить

            // Тестовые пользователи для демонстрации
            const mockUsers = [
                { name: "Александр", distance: "150 метров", username: "@alex_test" },
                { name: "Мария", distance: "400 метров", username: "@maria_design" },
                { name: "Дмитрий", distance: "1.2 км", username: "@dima_code" }
            ];

            mockUsers.forEach(user => {
                const card = document.createElement('div');
                card.className = 'user-card';
                card.innerHTML = `
                    <div>
                        <strong>${user.name}</strong><br>
                        <span style="font-size:12px; color:#888;">${user.username}</span>
                    </div>
                    <div class="distance">${user.distance}</div>
                `;
                // При клике открываем профиль человека в Telegram
                card.addEventListener('click', () => {
                    tg.openTelegramLink(`https://t.me/${user.username.replace('@', '')}`);
                });
                usersContainer.appendChild(card);
            });
            document.getElementById('status').innerText = "Готово! Найдены люди поблизости:";
        }
    </script>
</body>
</html>
